<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo de Recomendação — Resultados</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <link rel="stylesheet" href="styles-res.css">
</head>
<body>
    <header>
        <a href="/sistema.html" class="voltar">&#60;</a>
        <h2>Grafo de Recomendação</h2>
        <div class="seletor" id="seletor">
            <button data-sem="1">2026.1</button>
            <button data-sem="2">2026.2</button>
        </div>
        <div class="meta" id="meta"></div>
        <div class="legenda">
            <span class="pill">peso:
                <span class="dot" style="background:hsl(130,72%,45%)"></span>
                <span class="dot" style="background:hsl(65,72%,45%)"></span>
                <span class="dot" style="background:hsl(0,72%,45%)"></span> menor → maior</span>
            <span class="pill"><span class="dot" style="background:#95a5a6"></span> indisponível</span>
            <span class="pill"><span class="dot" style="background:#117a55;border:3px solid #f0a500"></span> recomendada</span>
        </div>
    </header>

    <div class="layout">
        <div id="cy"></div>
        <aside class="coluna-dir">
            <div id="painel" class="card-painel">
                <div class="vazio" id="painel-vazio">Clique em uma disciplina para ver a composição do peso.</div>
                <div id="painel-conteudo" style="display:none;"></div>
            </div>
            <div id="painel-optativas" class="card-painel">
                <h3 class="opt-titulo">Optativas disponíveis</h3>
                <div class="opt-sub" id="opt-sub"></div>
                <div id="opt-lista"></div>
            </div>
        </aside>
    </div>

    <section id="recs" style="display:none;">
        <div class="cabecalho">
            <h3 id="recs-titulo">Recomendadas para o próximo semestre</h3>
            <span class="resumo" id="recs-resumo"></span>
        </div>
        <div class="cards" id="recs-cards"></div>
    </section>

    <script>
    const API = 'http://localhost:3000';
    let GRAFO = null, CY = null, SEM = 2, OBS = null;   // SEM = semestre selecionado (1 ou 2)

    async function carregar() {
        const cyDiv = document.getElementById('cy');
        try {
            const resp = await fetch(`${API}/grafo-atual`);
            if (!resp.ok) {
                cyDiv.innerHTML = `<div class="vazio">Nenhum histórico processado ainda.<br>
                    <a href="/sistema.html">Enviar um histórico PDF</a></div>`;
                return;
            }
            GRAFO = await resp.json();
            desenhar(GRAFO);
        } catch (e) {
            cyDiv.innerHTML = `<div class="vazio">Não foi possível conectar ao servidor.<br>
                <span class="hint">Confira se o backend (porta 3000) está rodando.</span></div>`;
        }
    }

    // Cor por peso: verde (baixo) -> amarelo -> vermelho (alto)
    function corPorPeso(W, minW, maxW) {
        const t = maxW > minW ? (W - minW) / (maxW - minW) : 0.5;
        return `hsl(${Math.round(130 * (1 - t))}, 72%, 45%)`;
    }

    // A disciplina é ofertada no semestre sem (1 ou 2)?
    function ofertadaEm(po, sem) {
        if (!po || po.includes('/')) return true;          // desconhecida ou ambos
        try { return parseInt(po.split('-')[1][0], 10) === sem; }
        catch (e) { return true; }
    }

    function desenhar(grafo) {
        const nodes = grafo.elements.nodes;
        const edges = grafo.elements.edges;

        const ws = nodes.map(n => n.data.W);
        const minW = Math.min(...ws), maxW = Math.max(...ws);
        window._minW = minW; window._maxW = maxW;

        nodes.forEach(n => { n.data.rotulo = `${n.data.codigo}\n(W ${n.data.W})`; n.data.cor = '#95a5a6'; });

        // Colunas por período (ordenadas por W dentro da coluna)
        const COL_W = 210, ROW_H = 92;
        const grupos = {};
        nodes.forEach(n => { const p = n.data.periodo ?? 0; (grupos[p] = grupos[p] || []).push(n); });
        const periodos = Object.keys(grupos).map(Number).sort((a, b) => a - b);
        const cabecalhos = [];
        periodos.forEach((p, col) => {
            const x = col * COL_W;
            grupos[p].sort((a, b) => b.data.W - a.data.W);
            grupos[p].forEach((n, row) => { n.position = { x, y: row * ROW_H }; });
            cabecalhos.push({ data: { id: `hdr-${p}`, rotulo: `Período ${p}`, header: true, cor: 'transparent' },
                position: { x, y: -ROW_H }, selectable: false, grabbable: false });
        });

        CY = cytoscape({
            container: document.getElementById('cy'),
            elements: { nodes: nodes.concat(cabecalhos), edges },
            style: [
                { selector: 'node', style: {
                    'label': 'data(rotulo)', 'text-wrap': 'wrap', 'text-valign': 'center', 'text-halign': 'center',
                    'color': '#fff', 'font-size': '11px', 'font-weight': 'bold', 'shape': 'round-rectangle',
                    'background-color': 'data(cor)',
                    'width': `mapData(W, ${minW}, ${maxW}, 54, 104)`,
                    'height': `mapData(W, ${minW}, ${maxW}, 38, 66)`,
                    'border-width': 2, 'border-color': '#fff' } },
                { selector: 'node.indisponivel', style: { 'border-style': 'dashed', 'border-color': '#7f8c8d', 'color': '#eee' } },
                { selector: 'node.recomendada', style: { 'border-color': '#f0a500', 'border-width': 5, 'border-style': 'solid' } },
                { selector: 'node[?header]', style: {
                    'background-opacity': 0, 'border-width': 0, 'color': '#555',
                    'font-size': '13px', 'shape': 'rectangle', 'width': 'label', 'height': 18 } },
                { selector: 'edge', style: {
                    'width': 2.5, 'line-color': '#c4c4c4', 'target-arrow-color': '#c4c4c4',
                    'target-arrow-shape': 'triangle', 'curve-style': 'bezier' } },
                { selector: '.destacado', style: { 'line-color': '#000000', 'target-arrow-color': '#000000', 'width': 4 } },
                { selector: 'node.foco', style: { 'border-color': '#000000', 'border-width': 4 } }
            ],
            layout: { name: 'preset', fit: true, padding: 30 }
        });
        
        CY.on('tap', 'node', (evt) => {
            const n = evt.target;
            if (n.data('header')) return;
            CY.elements().removeClass('destacado foco');
            n.addClass('foco');
            n.outgoers('edge').addClass('destacado');
            n.outgoers('node').addClass('foco');
            mostrarPainel(n.data());
        });
        CY.on('tap', (evt) => { if (evt.target === CY) CY.elements().removeClass('destacado foco'); });

        // botões de semestre
        document.querySelectorAll('#seletor button').forEach(b =>
            b.addEventListener('click', () => aplicarSemestre(parseInt(b.dataset.sem, 10))));

        aplicarSemestre(SEM);
    }

    // Aplica o semestre escolhido: recolore, marca indisponíveis/recomendadas e atualiza os cards
    function aplicarSemestre(sem) {
        SEM = sem;
        const recs = (GRAFO.meta.recomendacao && GRAFO.meta.recomendacao[String(sem)]) || { codigos: [], horas: 0, w: 0 };
        const recSet = new Set(recs.codigos);
        let nDisp = 0;

        CY.batch(() => {
            CY.nodes().forEach(n => {
                if (n.data('header')) return;
                const d = n.data();
                const ofertada = ofertadaEm(d.periodo_ofertado, sem);
                const efetiva = d.disponivel && ofertada;     // disponível de fato neste semestre
                if (efetiva) nDisp++;
                n.data('cor', efetiva ? corPorPeso(d.W, window._minW, window._maxW) : '#95a5a6');
                n.removeClass('indisponivel recomendada');
                if (!efetiva) n.addClass('indisponivel');
                if (recSet.has(d.codigo)) n.addClass('recomendada');
            });
        });

        document.querySelectorAll('#seletor button').forEach(b =>
            b.classList.toggle('ativo', parseInt(b.dataset.sem, 10) === sem));

        const m = GRAFO.meta;
        document.getElementById('meta').innerHTML = `
            <span>Curso: <b>${m.curso ?? '—'}</b></span>
            <span>Período atual: <b>${m.periodo_atual ?? '—'}</b></span>
            <span>Disponíveis em 2026.${sem}: <b>${nDisp}</b></span>
            <span>Limite: <b>${m.max_horas}h</b> (≈ ${m.orcamento_materias} matérias · média ${m.media_aprovacoes ?? '—'}/sem)</span>
            <span>Recomendadas: <b>${recs.codigos.length}</b> (${recs.horas}h)</span>`;

        montarCards(recs, sem);
        montarListaOptativas(sem);
    }

    function montarCards(recs, sem) {
        const sec = document.getElementById('recs');
        sec.style.display = 'block';
        document.getElementById('recs-titulo').textContent = `Recomendadas para 2026.${sem}`;
        const slots = recs.slots_optativa || 0;
        document.getElementById('recs-resumo').textContent =
            `${recs.codigos.length} obrigatória(s) · ${recs.horas}h`
            + (slots ? ` · ${slots} vaga(s) livre(s) p/ optativa` : '');

        const cont = document.getElementById('recs-cards');
        if (!recs.codigos.length && !slots) {
            cont.innerHTML = `<div class="recs-vazio">Nada disponível e ofertado em 2026.${sem}.</div>`;
            return;
        }
        const dados = {};
        GRAFO.elements.nodes.forEach(n => dados[n.data.codigo] = n.data);

        let html = recs.codigos.map((c, i) => {
            const d = dados[c];
            return `<div class="card" style="transition-delay:${i * 60}ms">
                <div class="c-cod">${d.codigo}</div>
                <div class="c-nome">${d.nome}</div>
                <div class="c-meta"><span>${d.ch}h · período ${d.periodo}</span><span class="c-w">W ${d.W}</span></div>
            </div>`;
        }).join('');

        // Vagas livres: cards cinza apontando espaço para optativa
        for (let s = 0; s < slots; s++) {
            const i = recs.codigos.length + s;
            html += `<div class="card card-vazio" style="transition-delay:${i * 60}ms">
                <div class="c-cod">Optativa</div>
                <div class="c-nome">Espaço livre</div>
                <div class="c-meta"><span>escolha da lista ao lado</span><span>~64h</span></div>
            </div>`;
        }
        cont.innerHTML = html;

        // Revela os cards ao rolar
        if (OBS) OBS.disconnect();
        OBS = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visivel'); });
        }, { threshold: 0.15 });
        cont.querySelectorAll('.card').forEach(c => OBS.observe(c));
    }

    // Lista de optativas liberadas (prereq ok) e ofertadas no semestre selecionado
    function montarListaOptativas(sem) {
        const lista = (GRAFO.meta.lista_optativas || [])
            .filter(o => o.disponivel && ofertadaEm(o.periodo_ofertado, sem));
        document.getElementById('opt-sub').textContent =
            `${lista.length} liberada(s) e ofertada(s) em 2026.${sem}`;
        const cont = document.getElementById('opt-lista');
        if (!lista.length) {
            cont.innerHTML = `<div class="opt-vazio">Nenhuma optativa liberada neste semestre.</div>`;
            return;
        }
        cont.innerHTML = lista.map(o => `
            <div class="opt-row">
                <div class="opt-top"><span class="opt-cod">${o.codigo}</span><span class="opt-ch">${o.ch}h</span></div>
                <div class="opt-nome">${o.nome}</div>
                <div class="opt-per">período ${o.periodo}</div>
            </div>`).join('');
    }

    function mostrarPainel(d) {
        document.getElementById('painel-vazio').style.display = 'none';
        const cont = document.getElementById('painel-conteudo');
        cont.style.display = 'block';

        const ofertada = ofertadaEm(d.periodo_ofertado, SEM);
        const recomendada = ((GRAFO.meta.recomendacao[String(SEM)] || {}).codigos || []).includes(d.codigo);
        let status, cls;
        if (recomendada)            { status = '★ Recomendada para 2026.' + SEM; cls = 'rec'; }
        else if (!d.disponivel)     { status = '✗ Bloqueada (falta pré-requisito)'; cls = 'no'; }
        else if (!ofertada)         { status = '✗ Não ofertada em 2026.' + SEM; cls = 'no'; }
        else                        { status = '✓ Disponível em 2026.' + SEM; cls = 'ok'; }

        const pesos = [['P1 caminho crítico', d.P1], ['P2 obrigatoriedade', d.P2],
            ['P3 retenção', d.P3], ['P4 sazonalidade', d.P4], ['P5 atraso', d.P5]];
        const maxP = Math.max(1, ...pesos.map(p => p[1]));
        const linhas = pesos.map(([nome, v]) => `
            <div class="peso-row"><span class="nome">${nome}</span>
                <span class="bar"><span style="width:${(v / maxP) * 100}%"></span></span>
                <span class="val">${v}</span></div>`).join('');

        cont.innerHTML = `
            <div class="cod">${d.codigo} · ${d.tipo === 'Optativa' ? 'Optativa' : 'Obrigatória'} · ${d.ch}h · período ${d.periodo} · oferta ${d.periodo_ofertado || '—'}</div>
            <h3>${d.nome}</h3>
            <div class="status ${cls}">${status}</div>
            <div class="pesos">${linhas}</div>
            <div class="total">W total: ${d.W}</div>`;
    }

    carregar();
    </script>
</body>
</html>
